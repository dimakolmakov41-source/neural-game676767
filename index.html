<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игра закрыта</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b1729, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: rgba(18, 28, 40, 0.85);
            border: 2px solid #ff4444;
            border-radius: 30px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.4);
        }
        .title {
            font-size: 28px;
            font-weight: 900;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }
        .text {
            font-size: 16px;
            line-height: 1.5;
            color: #cccccc;
            margin-bottom: 30px;
        }
        .tg-btn {
            display: inline-block;
            background: linear-gradient(145deg, #229ED9, #196e9e);
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #5ec1ea;
            box-shadow: 0 0 15px rgba(34, 158, 217, 0.6);
            transition: 0.2s;
            width: 100%;
        }
        .tg-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(34, 158, 217, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🚫 ИГРА ЗАКРЫТА</div>
        <div class="text">
            Json файлы в игре сломаны и никак не чинятся в коде. Часто проверяйте игру ведь скоро выйдет новый Кликер либо новая игра. Если вы хотите играть без багов скачайте последнюю версию из телеграмм и играйте.
        </div>
        <a href="https://t.me/+U5ZGVdBqTxZjNDEy" target="_blank" class="tg-btn">💬 Перейти в Telegram</a>
    </div>
</body>
</html>
