<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #191919;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SPLASH / LOADING SCREEN --- */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f3f3f3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 50px 0;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-logo-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #000000;
            display: flex;
            align-items: center;
        }

        .splash-logo-o {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 8px solid #000000;
            transform: rotate(-12deg);
            margin: 0 3px;
        }

        .splash-loading-text {
            font-size: 18px;
            color: #aaaaaa;
            font-weight: 400;
            letter-spacing: 0.5px;
            animation: pulseDots 1.5s infinite ease-in-out;
        }

        @keyframes pulseDots {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* --- HEADER --- */
        .header {
            background: linear-gradient(180deg, #bde6ff 0%, #e8f6ff 60%, #ffffff 100%);
            padding: 12px 16px 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
        }

        .blue-dot {
            position: absolute;
            top: 2px;
            right: -2px;
            width: 7px;
            height: 7px;
            background-color: #0084ff;
            border-radius: 50%;
        }

        .roblox-logo {
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -1px;
            color: #000;
            display: flex;
            align-items: center;
        }

        .roblox-logo span {
            display: inline-block;
            transform: rotate(-10deg);
            background: #000;
            color: #fff;
            width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            font-size: 13px;
            margin: 0 1px;
            border-radius: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- MAIN CONTENT AREA --- */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 70px 16px;
        }

        .tab-page {
            display: none;
        }

        .tab-page.active {
            display: block;
        }

        /* --- USER PROFILE SECTION --- */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #e3e5e6;
            flex-shrink: 0;
            border: 2px solid #d0e4f2;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .user-name-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .user-name-container:active {
            background-color: #f0f0f0;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #393b3d;
        }

        .edit-icon {
            opacity: 0.6;
        }

        /* --- FRIENDS SECTION --- */
        .friends-section {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 24px;
        }

        .friend-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 72px;
            flex-shrink: 0;
        }

        .add-friend-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #e3e5e6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .friend-label {
            font-size: 12px;
            color: #393b3d;
            text-align: center;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #191919;
        }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #eaf6ff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #d0e4f2;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: #393b3d;
            font-size: 11px;
            cursor: pointer;
            width: 25%;
        }

        .nav-item.active {
            color: #000000;
            font-weight: 700;
        }

        .nav-avatar-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            overflow: hidden;
            background-color: #d1d5db;
        }

        .nav-avatar-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        /* --- MODAL CHANGE NAME --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            width: 85%;
            max-width: 320px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #191919;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .modal-input:focus {
            border-color: #0084ff;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel {
            background: #e3e5e6;
            color: #393b3d;
        }

        .btn-save {
            background: #0084ff;
            color: #ffffff;
        }
    </style>
</head>

    <!-- МОДАЛЬНОЕ ОКНО "ИЗМЕНИТЬ ИМЯ" -->
    <div class="modal-overlay" id="nameModal">
        <div class="modal-card">
            <div class="modal-title">Изменить имя</div>
            <input type="text" id="nameInput" class="modal-input" placeholder="Введите новое имя" maxlength="20">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeNameModal()">Отмена</button>
                <button class="btn btn-save" onclick="saveName()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // Таймер 5 секунд для экрана загрузки
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 500); 
            }, 5000); // 5 секунд
        });

        // Переключение вкладок
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
        }

        // Открытие окна смены имени
        function openNameModal() {
            const currentName = document.getElementById('usernameDisplay').innerText;
            const input = document.getElementById('nameInput');
            input.value = currentName === 'имя игрока' ? '' : currentName;
            document.getElementById('nameModal').classList.add('active');
            
            setTimeout(() => {
                input.focus();
            }, 100);
        }

        // Закрытие окна
        function closeNameModal() {
            document.getElementById('nameModal').classList.remove('active');
        }

        // Сохранение имени
        function saveName() {
            const input = document.getElementById('nameInput');
            const newName = input.value.trim();
            
            if (newName !== '') {
                document.getElementById('usernameDisplay').innerText = newName;
            }
            closeNameModal();
        }

        // Закрытие при клике на фон
        document.getElementById('nameModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeNameModal();
            }
        });
    </script>
