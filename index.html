<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧠 Эволюция Нейросетей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1729, #1e1b4b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: white;
            overflow: hidden;
        }

        /* ===== ЗАГРУЗКА ===== */
        #loadingScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0b1729;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader {
            width: 70px;
            height: 70px;
            border: 6px solid #2a4b6e;
            border-top: 6px solid #ffaa00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== ФИНАЛЬНЫЙ ЭКРАН ===== */
        #finalScreen {
            text-align: center;
            display: none;
            padding: 30px 20px;
        }
        #finalScreen.show {
            display: block;
        }
        .closed-title {
            color: #ff4444;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff444488, 0 0 40px #ff444444;
            animation: pulseRed 2s ease infinite;
        }
        @keyframes pulseRed {
            0%,100% { text-shadow: 0 0 20px #ff444488, 0 0 40px #ff444444; }
            50% { text-shadow: 0 0 30px #ff4444cc, 0 0 60px #ff444488; }
        }
        .closed-sub {
            color: #aac8f0;
            font-size: 16px;
            margin-bottom: 40px;
            text-shadow: 0 0 5px black;
        }
        .lang-title {
            color: #88aaff;
            font-size: 13px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .lang-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: linear-gradient(145deg, #2a4b6e, #1a3150);
            border: 2px solid #7aa5d9;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            text-shadow: 0 0 5px black;
        }
        .lang-btn:active {
            transform: scale(0.96);
        }
        .lang-btn.active {
            background: linear-gradient(145deg, #ffaa00, #ff5500);
            border-color: #ffffaa;
            box-shadow: 0 0 20px #ffaa0088;
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loader"></div>
    </div>

    <div id="finalScreen">
        <div class="closed-title" id="closedTitle">Игра закрыта</div>
        <div class="closed-sub" id="closedSub">Игру невозможно восстановить</div>
        <div class="lang-title" id="langTitle">Сменить язык</div>
        <div class="lang-buttons">
            <button class="lang-btn active" id="btnRu">Русский</button>
            <button class="lang-btn" id="btnEn">English</button>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('shutdownLang') || 'ru';

        const texts = {
            ru: {
                closed: "Игра закрыта",
                sub: "Игру невозможно восстановить",
                lang: "Сменить язык"
            },
            en: {
                closed: "Game closed",
                sub: "The game cannot be restored",
                lang: "Change language"
            }
        };

        function applyLang() {
            const t = texts[currentLang];
            document.getElementById('closedTitle').innerText = t.closed;
            document.getElementById('closedSub').innerText = t.sub;
            document.getElementById('langTitle').innerText = t.lang;
            document.getElementById('btnRu').classList.toggle('active', currentLang === 'ru');
            document.getElementById('btnEn').classList.toggle('active', currentLang === 'en');
            document.documentElement.lang = currentLang;
            localStorage.setItem('shutdownLang', currentLang);
        }

        document.getElementById('btnRu').addEventListener('click', () => {
            currentLang = 'ru';
            applyLang();
        });
        document.getElementById('btnEn').addEventListener('click', () => {
            currentLang = 'en';
            applyLang();
        });

        // Загрузка 2 секунды, потом показываем финальный экран
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('finalScreen').classList.add('show');
            applyLang();
        }, 2000);
    </script>
</body>
</html>
